name: Build Godot SIP Binaries

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - os: macos-14
            platform: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ccache \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            libasound2-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install automake autoconf libtool pkg-config openssl@3 ccache

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-${{ matrix.arch }}-

      - name: Configure pjproject TLS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item thirdparty/pjsip/pjproject/pjlib/include/pj/config_site_sample.h thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h -Force
          Add-Content thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h ""
          Add-Content thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h "#define PJ_HAS_SSL_SOCK 1"
          Add-Content thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h "#define PJ_SSL_SOCK_IMP PJ_SSL_SOCK_IMP_SCHANNEL"

      - name: Configure pjproject TLS (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp thirdparty/pjsip/pjproject/pjlib/include/pj/config_site_sample.h thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h
          {
            echo ""
            echo "#define PJ_HAS_SSL_SOCK 1"
            echo "#define PJ_SSL_SOCK_IMP PJ_SSL_SOCK_IMP_OPENSSL"
            echo "#define PJ_IS_LITTLE_ENDIAN 1"
            echo "#define PJ_IS_BIG_ENDIAN 0"
          } >> thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h

      - name: Build pjproject (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          msbuild thirdparty/pjsip/pjproject/pjproject-vs14.sln /m /p:Configuration=Release-Static /p:Platform=x64

      - name: Build pjproject (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 1G
          JOBS=2
          cd thirdparty/pjsip/pjproject
          ./configure CFLAGS="-fPIC" CXXFLAGS="-fPIC"
          make dep
          make -j"${JOBS}"
          ccache -s

      - name: Build pjproject (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 1G
          JOBS=3
          cd thirdparty/pjsip/pjproject
          ./configure \
            --with-ssl="${OPENSSL_PREFIX}" \
            CFLAGS="-fPIC -I${OPENSSL_PREFIX}/include" \
            CXXFLAGS="-fPIC -I${OPENSSL_PREFIX}/include" \
            LDFLAGS="-L${OPENSSL_PREFIX}/lib"
          make dep
          make -j"${JOBS}"
          ccache -s

      - name: Checkout godot-cpp
        shell: bash
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp submodule update --init --recursive

      - name: Configure and build extension (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build_ci -G "Visual Studio 17 2022" -A x64 `
            -DGODOT_CPP_PATH="${{ github.workspace }}/.deps/godot-cpp" `
            -DPJSIP_PATH="${{ github.workspace }}/thirdparty/pjsip/pjproject" `
            -DGODOT_SIP_PLATFORM="${{ matrix.platform }}" `
            -DGODOT_SIP_ARCH="${{ matrix.arch }}"
          cmake --build build_ci --config Debug
          cmake --build build_ci --config Release

      - name: Configure and build extension (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CCACHE_DIR="${HOME}/.ccache"
          JOBS=2
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            JOBS=2
          fi
          cmake -S . -B build_ci_debug \
            -DGODOT_CPP_PATH="${GITHUB_WORKSPACE}/.deps/godot-cpp" \
            -DPJSIP_PATH="${GITHUB_WORKSPACE}/thirdparty/pjsip/pjproject" \
            -DGODOT_SIP_PLATFORM="${{ matrix.platform }}" \
            -DGODOT_SIP_ARCH="${{ matrix.arch }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_ci_debug --parallel "${JOBS}"

          cmake -S . -B build_ci_release \
            -DGODOT_CPP_PATH="${GITHUB_WORKSPACE}/.deps/godot-cpp" \
            -DPJSIP_PATH="${GITHUB_WORKSPACE}/thirdparty/pjsip/pjproject" \
            -DGODOT_SIP_PLATFORM="${{ matrix.platform }}" \
            -DGODOT_SIP_ARCH="${{ matrix.arch }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_ci_release --parallel "${JOBS}"
          ccache -s

      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bin
          SEARCH_DIRS=()
          for d in build_ci build_ci_debug build_ci_release; do
            if [[ -d "$d" ]]; then
              SEARCH_DIRS+=("$d")
            fi
          done

          if [[ ${#SEARCH_DIRS[@]} -eq 0 ]]; then
            echo "No build directories found."
            exit 1
          fi

          find "${SEARCH_DIRS[@]}" -type f \
            \( -name "godot_sip.*.dll" -o -name "godot_sip.*.so" -o -name "godot_sip.*.dylib" \) \
            -exec cp {} artifacts/bin/ \;

          if [[ -z "$(ls -A artifacts/bin)" ]]; then
            echo "No binaries collected."
            exit 1
          fi

          ls -lah artifacts/bin

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-sip-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/bin/*
          if-no-files-found: error

  build-android:
    name: Build (android-arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            zip

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-arm64-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-android-arm64-${{ github.ref_name }}-
            ccache-android-arm64-

      - name: Configure pjproject for Android
        shell: bash
        run: |
          set -euo pipefail
          cp thirdparty/pjsip/pjproject/pjlib/include/pj/config_site_sample.h thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h
          {
            echo ""
            echo "#define PJ_IS_LITTLE_ENDIAN 1"
            echo "#define PJ_IS_BIG_ENDIAN 0"
          } >> thirdparty/pjsip/pjproject/pjlib/include/pj/config_site.h
          cd thirdparty/pjsip/pjproject
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}"
          export APP_PLATFORM=android-24
          export TARGET_ABI=arm64-v8a
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_DIR="${HOME}/.ccache"
          ccache -M 1G
          chmod +x ./configure-android
          ./configure-android --use-ndk-cflags

      - name: Build pjproject for Android
        shell: bash
        run: |
          set -euo pipefail
          cd thirdparty/pjsip/pjproject
          make dep
          make -j"$(nproc)"
          ccache -s

      - name: Checkout godot-cpp
        shell: bash
        run: |
          git clone --depth 1 https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp submodule update --init --recursive

      - name: Configure and build extension (Android Debug/Release)
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="${HOME}/.ccache"

          cmake -S . -B build_android_debug -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_static \
            -DGODOT_CPP_PATH="${GITHUB_WORKSPACE}/.deps/godot-cpp" \
            -DPJSIP_PATH="${GITHUB_WORKSPACE}/thirdparty/pjsip/pjproject" \
            -DGODOT_SIP_PLATFORM=android \
            -DGODOT_SIP_ARCH=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_android_debug -j

          cmake -S . -B build_android_release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_static \
            -DGODOT_CPP_PATH="${GITHUB_WORKSPACE}/.deps/godot-cpp" \
            -DPJSIP_PATH="${GITHUB_WORKSPACE}/thirdparty/pjsip/pjproject" \
            -DGODOT_SIP_PLATFORM=android \
            -DGODOT_SIP_ARCH=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_android_release -j
          ccache -s

      - name: Collect Android binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bin
          find build_android_debug build_android_release -type f -name "godot_sip.android.*.arm64.so" -exec cp {} artifacts/bin/ \;
          ls -lah artifacts/bin

      - name: Upload Android binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-sip-android-arm64
          path: artifacts/bin/*
          if-no-files-found: error

  package-addon:
    name: Package Addon
    runs-on: ubuntu-24.04
    needs: [build, build-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Assemble addon package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/addons/godot_sip/bin
          find downloaded -type f \
            \( -name "godot_sip.*.dll" -o -name "godot_sip.*.so" -o -name "godot_sip.*.dylib" \) \
            -exec cp {} package/addons/godot_sip/bin/ \;
          cp godot_sip.gdextension package/addons/godot_sip/godot_sip.gdextension
          cp README.md package/addons/godot_sip/README.md
          cp LICENSE package/addons/godot_sip/LICENSE
          if [[ -d demo ]]; then
            cp -R demo package/addons/godot_sip/demo
          fi

      - name: Upload packaged addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot_sip-addon-package
          path: package/addons/**
          if-no-files-found: error

      - name: Create release zip (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          PKG_NAME="godot_sip-addon-${GITHUB_REF_NAME}.zip"
          (cd package && zip -r "../${PKG_NAME}" addons)
          echo "PKG_NAME=${PKG_NAME}" >> "${GITHUB_ENV}"

      - name: Delete intermediate platform artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"

          while IFS=$'\t' read -r ART_ID ART_NAME; do
            if [[ "${ART_NAME}" == "godot_sip-addon-package" ]]; then
              continue
            fi
            if [[ "${ART_NAME}" == godot-sip-* ]]; then
              echo "Deleting ${ART_NAME} (${ART_ID})"
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${ART_ID}"
            fi
          done < <(
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" --paginate \
              --jq '.artifacts[] | [.id, .name] | @tsv'
          )

      - name: Publish release asset (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_NAME }}
